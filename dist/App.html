    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return new TextDecoder().decode(u);
  }
  ['cm-src', 'app-src'].forEach(function (id) {
    var s = document.createElement('script');
    s.textContent = text(id);
    document.body.appendChild(s);
  });
})();
</script>

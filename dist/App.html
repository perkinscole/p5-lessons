`,steps:[{title:"Meet the grid",mins:5,say:"Press **Run**. The blue square is your **canvas**, 400 dots wide and 400 tall.\n\nPositions are written `(x, y)`. `x` counts dots from the left. `y` counts dots from the **top**, so bigger `y` means lower down. Most people expect the opposite, so keep this one in mind."},{title:"Add a sun",mins:5,say:"Each drawing command is a **function call**: a name, then numbers in parentheses. These numbers are called **arguments**.\n\n`ellipse(x, y, width, height)` draws a circle or oval. Add this line inside `draw()`, below `background`:",code:"  ellipse(340, 60, 70, 70);",at:{after:"background(135, 206, 235);"},check:/ellipse\s*\(/,hint:"It needs to go between the { and } of draw(), after the background line."},{title:"Add the ground",mins:5,say:"`rect(x, y, width, height)` draws a rectangle from its **top-left corner**. Add a strip of ground along the bottom of the canvas.",code:"  rect(0, 320, 400, 80);",at:{after:"ellipse(340, 60, 70, 70);"},check:/rect\s*\(/},{title:"Add color",mins:5,say:"Screens mix **red, green, and blue** light, each from 0 to 255. `fill(r, g, b)` sets the color for every shape drawn after it, like dipping a brush in paint. Make the sun yellow and the ground green.",edits:[{code:"  fill(255, 220, 60);",at:{before:"ellipse(340, 60, 70, 70);"}},{code:"  fill(90, 170, 80);",at:{before:"rect(0, 320, 400, 80);"}}],show:`fill(255, 220, 60);
ellipse(340, 60, 70, 70);
fill(90, 170, 80);
rect(0, 320, 400, 80);`,check:/fill\s*\(/},{title:"Draw a character",mins:10,say:"Now build a character out of shapes: at least **three more** shapes, standing on the ground. Try a `rect` for a body, an `ellipse` for a head, and `line(x1, y1, x2, y2)` for arms.\n\nGuess the numbers, press Run, and adjust. That loop of guess, run, and fix is how programmers actually work.",reveal:!0,code:`  rect(180, 240, 40, 80);
  ellipse(200, 215, 50, 50);
  line(180, 260, 150, 290);
  line(220, 260, 250, 290);`,at:{after:"rect(0, 320, 400, 80);"},check:/(?:(?:rect|ellipse|line|triangle)\s*\([^)]*\)[\s\S]*){5,}/,hint:"You need 5 or more shapes in total, counting the sun and the ground."},{title:"Read the error",mins:5,say:"Delete the `)` from one of your lines and press Run. Read the message under the canvas: it tells you the line number. Put the `)` back.\n\nErrors do not mean you failed. They are the computer asking you a question, and you will see them every day from now on."}],stretch:["Add a cloud made of three overlapping ellipses.","Use `triangle(x1, y1, x2, y2, x3, y3)` to draw a mountain behind your character.","Add a house or a tree to the scene."],reflect:"Why do you think y counts down from the top instead of up from the bottom?"});B({id:"t2",title:"Monster Maker",mins:35,concepts:["color","sequence"],hook:"Time to add color. You will build a monster and discover that the order of your code decides what sits in front of what.",starter:`function setup() {

}

function draw() {
  background(40, 30, 70);

  // monster body
  ellipse(200, 220, 220, 240);
}
`,steps:[{title:"Mix a color",mins:6,say:"Screens mix **red, green, and blue** light, each from 0 to 255. `fill(r, g, b)` sets the color for every shape drawn after it, like dipping a brush in paint. Add it above the body:",code:"  fill(120, 220, 90);",at:{before:"ellipse(200, 220, 220, 240);"},check:/fill\s*\(/},{title:"Add eyes",mins:7,say:"Add two white eyes with dark pupils. Notice the pupils come **after** the whites. The computer runs your code **top to bottom**, one line at a time. This is called **sequence**, and later shapes paint over earlier ones.",code:`

  ellipse(240, 180, 60, 60);

That is **breadth-first search**. It uses a **queue**, a list where you add to the back and take from the front, like a lunch line. Read this over, and talk it through with a partner before moving on.`},{title:"Which tiles are open?",mins:5,reveal:!0,say:'First a small helper. Write a function called `isOpen(col, row)` at the bottom. Return `false` if the tile is off the map. `||` means **or**, so one `if` can check all four edges. Otherwise, return whether `tileMap[row][col]` is something other than `"#"`.',code:`function isOpen(col, row) {

  let queue = [{ col: goalCol, row: goalRow }];
  let cameFrom = {};
  cameFrom[goalCol + "," + goalRow] = null;

  while (queue.length > 0) {

    let current = queue.shift();

    // did the water reach the hunter?
    if (current.col === startCol && current.row === startRow) {
      return cameFrom[current.col + "," + current.row];
    }

    // spread to the four neighbors
    let neighbors = [
      { col: current.col + 1, row: current.row },
      { col: current.col - 1, row: current.row },
      { col: current.col, row: current.row + 1 },
      { col: current.col, row: current.row - 1 },

      let n = neighbors[i];

      if (isOpen(n.col, n.row) && cameFrom[id] === undefined) {
        cameFrom[id] = current;
        queue.push(n);
      }
    }
  }
  return null;
}`,at:{end:!0},check:[/while\s*\(/,/\.shift\s*\(\s*\)/,/\.push\s*\(/,/cameFrom\s*\[\s*\w+\s*\]\s*=\s*\w/],hint:"TODO 1: let current = queue.shift(); TODO 3 uses queue.push(n).",skeleton:[{code:`function nextStep(startCol, startRow, goalCol, goalRow) {

// Beyond the Summit, you can learn to write code like this yourself.

let sparks = [];

class Spark {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = random(-3, 3);
    this.vy = random(-3, 3);
    this.life = 255;
  }

  update() {
    this.x = this.x + this.vx;
    this.y = this.y + this.vy;
    this.life = this.life - 8;
  }

  show() {
    noStroke();
    fill(255, 220, 80, this.life);
    rect(this.x, this.y, 4, 4);
  }
}

// Make a burst of sparks at a spot on the screen.
function burst(x, y) {
  for (let i = 0; i < 25; i = i + 1) {
    sparks.push(new Spark(x, y));
  }
}

// Move and draw every spark. Call this once each frame.
function updateSparks() {
  for (let i = sparks.length - 1; i >= 0; i = i - 1) {
    sparks[i].update();
    sparks[i].show();
    if (sparks[i].life <= 0) {
      sparks.splice(i, 1);
    }
  }
}
`},check:/this\.life/,hint:"You only need two things from this file: burst(x, y) and updateSparks()."},{title:"Burst on a score",mins:3,say:"Your game is different from everyone else's, but all of them have a `score`. So we watch it: when it goes up, burst! Add the variable at the top, and the code at the end of `playGame`.",edits:[{code:`let lastScore = 0;

 network, including devices, routers, switches, cables, wires, and transponders."},{code:"6-8.CS.c.3",strand:"Computing Systems",topic:"Networks",text:"Describe how information, both text and non-text, is translated and communicated between digital devices over a computer network."},{code:"6-8.CS.d.1",strand:"Computing Systems",topic:"Services",text:"Identify capabilities of devices that are enabled through services (e.g., a wearable device that stores fitness data in the cloud, a mobile device that uses location services for navigation)."},{code:"6-8.CT.a.1",strand:"Computational Thinking",topic:"Abstraction",text:"Describe how data is abstracted by listing attributes of everyday items to represent, order and compare those items (e.g., street address as an abstraction for locations; car make, model, and license plate number as an abstraction for cars)."},{code:"6-8.CT.a.2",strand:"Computational Thinking",topic:"Abstraction",text:"Define a simple function that represents a more complex task/problem and can be reused to solve similar tasks/problems."},{code:"6-8.CT.a.3",strand:"Computational Thinking",topic:"Abstraction",text:"Use decomposition to define and apply a hierarchical classification scheme to a complex system, such as the human body, animal classification, or in computing."},{code:"6-8.CT.b.1",strand:"Computational Thinking",topic:"Algorithms",text:"Design solutions that use repetition and conditionals."},{code:"6-8.CT.b.2",strand:"Computational Thinking",topic:"Algorithms",text:"Use logical reasoning to predict outputs given varying inputs."},{code:"6-8.CT.b.3",strand:"Computational Thinking",topic:"Algorithms",text:"Individually and collaboratively decompose a problem and create a sub-solution for each of its parts (e.g., video game, robot obstacle course, making dinner)."},{code:"6-8.CT.b.4",strand:"Computational Thinking",topic:"Algorithms",text:"Recognize that more than one algorithm can solve a given problem."},{code:"6-8.CT.b.5",strand:"Computationa

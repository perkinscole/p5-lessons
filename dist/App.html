rect(0, 320, 400, 80);`,check:/fill\s*\(/},{title:"Draw a character",mins:10,say:"Now build a character out of shapes: at least **three more** shapes, standing on the ground. Try a `rect` for a body, an `ellipse` for a head, and `line(x1, y1, x2, y2)` for arms.\n\nGuess the numbers, press Run, and adjust. That loop of guess, run, and fix is how programmers actually work.",reveal:!0,code:`  rect(180, 240, 40, 80);
  ellipse(200, 215, 50, 50);
  line(180, 260, 150, 290);
  line(220, 260, 250, 290);`,at:{after:"rect(0, 320, 400, 80);"},check:/(?:(?:rect|ellipse|line|triangle)\s*\([^)]*\)[\s\S]*){5,}/,hint:"You need 5 or more shapes in total, counting the sun and the ground."},{title:"Read the error",mins:5,say:"Delete the `)` from one of your lines and press Run. Read the message under the canvas: it tells you the line number. Put the `)` back.\n\nErrors do not mean you failed. They are the computer asking you a question, and you will see them every day from now on."}],stretch:["Add a cloud made of three overlapping ellipses.","Use `triangle(x1, y1, x2, y2, x3, y3)` to draw a mountain behind your character.","Add a house or a tree to the scene."],reflect:"Why do you think y counts down from the top instead of up from the bottom?"});W({id:"t2",title:"Monster Maker",mins:35,concepts:["color","sequence"],hook:"Time to add color. You will build a monster and discover that the order of your code decides what sits in front of what.",starter:`function setup() {

  // monster body

That is **breadth-first search**. It uses a **queue**, a list where you add to the back and take from the front, like a lunch line. Read this over, and talk it through with a partner before moving on.`},{title:"Which tiles are open?",mins:5,reveal:!0,say:'First a small helper. Write a function called `isOpen(col, row)` at the bottom. Return `false` if the tile is off the map. `||` means **or**, so one `if` can check all four edges. Otherwise, return whether `tileMap[row][col]` is something other than `"#"`.',code:`function isOpen(col, row) {

  let queue = [{ col: goalCol, row: goalRow }];
  let cameFrom = {};
  cameFrom[goalCol + "," + goalRow] = null;

  while (queue.length > 0) {
    // take the next tile from the front of the line
    let current = queue.shift();

    // did the water reach the hunter?
    if (current.col === startCol && current.row === startRow) {
      return cameFrom[current.col + "," + current.row];
    }

    // spread to the four neighbors
    let neighbors = [
      { col: current.col + 1, row: current.row },
      { col: current.col - 1, row: current.row },
      { col: current.col, row: current.row + 1 },
      { col: current.col, row: current.row - 1 },
    ];
    for (let i = 0; i < neighbors.length; i = i + 1) {
      let n = neighbors[i];
      let id = n.col + "," + n.row;
      if (isOpen(n.col, n.row) && cameFrom[id] === undefined) {
        cameFrom[id] = current;
        queue.push(n);
      }
    }
  }
  return null;
}`,at:{end:!0},check:[/while\s*\(/,/\.shift\s*\(\s*\)/,/\.push\s*\(/,/cameFrom\s*\[\s*\w+\s*\]\s*=\s*\w/],hint:"TODO 1: let current = queue.shift(); TODO 3 uses queue.push(n).",skeleton:[{code:`function nextStep(startCol, startRow, goalCol, goalRow) {

t",text:"Identify and discuss the technology proficiencies needed in the classroom and the workplace, and how to meet the needs."},{code:"6-8.CAS.c.3",strand:"Computing and Society",topic:"Interpersonal and Societal Impact",text:"Relate the distribution of computing resources in a global society to issues of equity, access, and power."},{code:"6-8.CAS.c.4",strand:"Computing and Society",topic:"Interpersonal and Societal Impact",text:"Evaluate how media and technology can be used to distort, exaggerate, and misrepresent information."},{code:"6-8.CAS.c.5",strand:"Computing and Society",topic:"Interpersonal and Societal Impact",text:"Evaluate the bias of digital information sources, including websites."},{code:"6-8.DTC.a.1",strand:"Digital Tools and Collaboration",topic:"Digital Tools",text:"Identify and explain the strengths, weaknesses, and capabilities of a variety of digital tools."},{code:"6-8.DTC.a.2",strand:"Digital Tools and Collaboration",topic:"Digital Tools",text:"Identify the kinds of content associated with different file types and why different file types exist (e.g., formats for word processing, images, music, three-dimensional drawings.)."},{code:"6-8.DTC.a.3",strand:"Digital Tools and Collaboration",topic:"Digital Tools",text:"Integrate information from multiple file formats into a single artifact."},{code:"6-8.DTC.a.4",strand:"Digital Tools and Collaboration",topic:"Digital Tools",text:"Individually and collaboratively use advanced tools to design and create online content (e.g., digital portfolio, multimedia, blog, webpage)."},{code:"6-8.DTC.a.5",strand:"Digital Tools and Collaboration",topic:"Digital Tools",text:"Individually and collaboratively develop and conduct an online survey."},{code:"6-8.DTC.b.1",strand:"Digital Tools and Collaboration",topic:"Collaboration and Communication",text:"Communicate and publish key ideas and details individually or collaboratively in a way that informs, persuades, and/or entertains using a variety of digital tools
